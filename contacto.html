<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Mendez | Contacto</title>
    <meta name="description"
        content="Información de contacto de Carlos Mendez, desarrollador web con experiencia en HTML, CSS y JavaScript.">

    <!-- Referencia a la fuente de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Overlock+SC&display=swap" rel="stylesheet">

    <!-- Referencia al archivo de estilos CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <h1>Contacto</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="proyectos.html">Proyectos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <!-- Seccion contacto -->
        <section id="contacto">
            <h2>Información de Contacto</h2>
            <p>Nombre: Carlos Eduardo Olano Mendez</p>
            <p>Correo Electrónico: <a href="mailto:carlos.ed4work@gmail.com">carlos.ed4work@gmail.com</a></p>
            <p>Teléfono: +503 7402-1140</p>
            <p><a href="https://www.linkedin.com/in/carlos4work/" target="_blank">LinkedIn</a></p>
            <p><a href="https://github.com/CrlsMenz" target="_blank">GitHub</a></p>

            <form action="https://formspree.io/f/xoedlowj" method="POST">
                <fieldset>
                    <legend>Datos de contacto</legend>

                    <label for="name">Nombre Completo:</label>
                    <input type="text" id="name" name="nombre" required>
                    <br><br>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                    <br><br>
                    <label for="asunto">Asunto:</label>
                    <select id="asunto" name="asunto" required>
                        <option value="">Seleccione un asunto</option>
                        <option value="consulta">Oferta de empleo</option>
                        <option value="sugerencia">Propuesta de proyecto</option>
                        <option value="otro">Otro</option>
                    </select>
                    <br><br>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                    <br><br>
                    <input type="checkbox" id="aceptar" name="aceptar" required>
                    <label for="aceptar">Acepto que me contacten</label>
                    <br><br>
                    <button type="submit">Enviar Mensaje</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Carlos Eduardo Olano Mendez</p>
    </footer>
</body>

</html>
